# Test High Availability with autoscaling
crds:
  keep: false

controller:
  autoscaling:
    enabled: true
    minReplicas: 2

redis-ha:
  enabled: true
  exporter:
    enabled: true

server:
  autoscaling:
    enabled: true
    minReplicas: 2

repoServer:
  autoscaling:
    enabled: true
    minReplicas: 2
